name = "ai-job-agent-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "ai-job-agent-db"
database_id = "7781002f-852a-4156-bd7a-3d31f2585cc0"
migrations_dir = "../../packages/db/migrations"

[[kv_namespaces]]
binding = "KV"
id = "1e06366b25ae4199bad36705e2a11953"

[[r2_buckets]]
binding = "R2"
bucket_name = "ai-job-agent-files"

[[vectorize]]
binding = "VECTORIZE_JOBS"
index_name = "job-embeddings"

[[vectorize]]
binding = "VECTORIZE_PROFILES"
index_name = "profile-embeddings"

[ai]
binding = "AI"

[vars]
ENVIRONMENT = "development"
AWS_REGION = "us-east-1"
BEDROCK_MODEL_ID = "us.anthropic.claude-sonnet-4-6"

# Secrets (set via: wrangler secret put JWT_SECRET)
# JWT_SECRET
# AWS_ACCESS_KEY_ID
# AWS_SECRET_ACCESS_KEY
# APIFY_API_TOKEN
