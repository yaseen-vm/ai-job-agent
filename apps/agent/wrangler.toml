name = "ai-job-agent-agent"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "ai-job-agent-db"
database_id = "7781002f-852a-4156-bd7a-3d31f2585cc0"

[[r2_buckets]]
binding = "R2"
bucket_name = "ai-job-agent-files"

[[vectorize]]
binding = "VECTORIZE_PROFILES"
index_name = "profile-embeddings"

[ai]
binding = "AI"

[vars]
ENVIRONMENT = "development"
AWS_REGION = "us-east-1"
BEDROCK_MODEL_ID = "us.anthropic.claude-sonnet-4-6"

# Secrets (set via: wrangler secret put AWS_ACCESS_KEY_ID)
# AWS_ACCESS_KEY_ID
# AWS_SECRET_ACCESS_KEY
