name = "ai-job-agent-agent"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "ai-job-agent-db"
database_id = "REPLACE_WITH_D1_ID"

[[r2_buckets]]
binding = "R2"
bucket_name = "ai-job-agent-files"

[ai]
binding = "AI"

[[queues.consumers]]
queue = "ai-job-agent-agent"
max_batch_size = 5
max_batch_timeout = 60
max_retries = 2

[vars]
ENVIRONMENT = "development"
AWS_REGION = "us-east-1"
BEDROCK_MODEL_ID = "anthropic.claude-opus-4-5"

# Secrets (set via: wrangler secret put AWS_ACCESS_KEY_ID)
# AWS_ACCESS_KEY_ID
# AWS_SECRET_ACCESS_KEY
