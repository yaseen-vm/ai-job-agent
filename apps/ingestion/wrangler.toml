name = "ai-job-agent-ingestion"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "ai-job-agent-db"
database_id = "7781002f-852a-4156-bd7a-3d31f2585cc0"

[[vectorize]]
binding = "VECTORIZE_JOBS"
index_name = "job-embeddings"

[ai]
binding = "AI"

[triggers]
crons = ["0 6 * * *"]

[vars]
ENVIRONMENT = "development"
