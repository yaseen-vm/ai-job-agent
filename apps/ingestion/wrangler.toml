name = "ai-job-agent-ingestion"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "ai-job-agent-db"
database_id = "REPLACE_WITH_D1_ID"

[ai]
binding = "AI"

[[queues.consumers]]
queue = "ai-job-agent-ingestion"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 3

[[queues.producers]]
binding = "QUEUE_INGESTION"
queue = "ai-job-agent-ingestion"

[triggers]
crons = ["0 6 * * *"]

[vars]
ENVIRONMENT = "development"
